<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Option Scanner</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">

    <h1>Market Scanner</h1>

    <table>
      <thead>
        <tr>
          <th>Ticker</th>
          <th>Price</th>
          <th>Volume</th>
          <th>% Change</th>
          <th class="level-col">PDH</th>
          <th class="level-col">PMH</th>
          <th class="level-col">PDL</th>
          <th class="level-col">PML</th>
          <th>10m 8EMA</th>
          <th>EMA Dist</th>
          <th>Trend</th>
        </tr>
      </thead>

      <tbody id="scanner-body">
      </tbody>

    </table>

  </div>

  <script src="script.js"></script>

</body>
</html>
